# Apache config for the optional Docker setup (mounted by docker-compose.yml).
#
# The rewrite rules live here, in the container's Apache config, and NOT in
# wordpress/.htaccess. The self-hosted deploy uploads the top-level files of
# wordpress/, so a .htaccess created there would overwrite production's.
<Directory /var/www/html>
    AllowOverride All

    RewriteEngine On
    RewriteBase /
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</Directory>
